name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.9  # keep in step with .pre-commit-config.yaml
      - run: ruff check
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # OSMesa is a software OpenGL, so the MCP render_video test draws frames on a
      # runner with no GPU and no EGL; the test fails on CI if it cannot render.
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
      - run: pip install -e ".[dev,mcp]"
      - run: pytest tests/ -v
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
