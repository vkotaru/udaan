name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10  # keep in step with .pre-commit-config.yaml
      - run: ruff check
      - run: ruff format --check

  # udaan/ is clean under mypy as of v2.0.0. Gated here so it stays that way;
  # `warn_unused_ignores` is on, so stale `# type: ignore` comments fail too.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy udaan/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # -W: the docs build is warning-free; a new warning is a build failure.
      # Broken toctree entries, malformed docstrings and duplicate object
      # descriptions all surface here. A *missing* autodoc stub does not —
      # Sphinx never warns about a module nothing includes, so adding the stub
      # for a new module stays a manual step (see docs/ in CLAUDE.md).
      #
      # The gate is deterministic offline: docs/conf.py prefetches the
      # intersphinx inventories itself and drops any it cannot reach, so an
      # unreachable docs.python.org cannot turn `-W` red.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
